<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0b0f" />
    <meta name="description" content="粘贴抖音 / 西瓜 / 小红书 / B站 分享链接，获取无水印原始视频" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <title>视频去水印</title>
  </head>
  <body>
    <main class="app">
      <header class="hero">
        <div class="brand-row">
          <h1>视频去水印</h1>
          <button id="logout-btn" class="btn-lock" type="button" title="退出验证" hidden>
            🔒 锁定
          </button>
        </div>
        <p class="sub">抖音 · 西瓜 · 小红书 · B站 —— 粘贴分享链接，获取无水印原视频</p>
      </header>

      <!-- 密码验证卡片（当后端开启验证且尚未登录时显示） -->
      <section id="auth-card" class="panel auth-card" hidden>
        <div class="auth-header">
          <div class="auth-icon-badge">🔐</div>
          <h2 class="auth-title">访问验证</h2>
          <p class="auth-desc">本站已启用访问密码保护，请输入密码后继续使用</p>
        </div>
        <form id="auth-form" class="auth-form" autocomplete="off">
          <input
            id="auth-password"
            class="auth-input"
            type="password"
            placeholder="请输入访问密码…"
            autocomplete="current-password"
            required
          />
          <button id="auth-submit" class="btn primary auth-submit" type="submit">
            解锁访问
          </button>
          <p id="auth-status" class="status error" hidden></p>
        </form>
      </section>

      <!-- 主应用区域（验证通过或未启用密码时显示） -->
      <div id="main-content">
        <form id="form" class="panel" autocomplete="off">
          <textarea
            id="input"
            rows="3"
            placeholder="把抖音 / 西瓜 / 小红书 / B站 的分享文案或链接粘到这里…"
          ></textarea>
          <div class="form-actions">
            <button id="go" class="btn primary" type="submit">解析</button>
            <button id="clear" class="btn ghost" type="button">清空</button>
          </div>
        </form>

        <p id="status" class="status" hidden></p>
        <section id="result" class="result" hidden></section>
      </div>

      <footer class="foot">
        仅供个人学习备份使用，请尊重原作者版权。
      </footer>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
